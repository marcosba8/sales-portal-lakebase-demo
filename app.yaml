# Databricks App runtime config — COMMAND ONLY. Do NOT put an `env:` block here.
#
# The Databricks Apps runtime reads this file's env when present, and it would
# SHADOW the environment DABs injects via resources/app.yml — silently dropping
# LAKEBASE_ENDPOINT / WAREHOUSE_ID / GOLD_CATALOG / GOLD_SCHEMA and making the
# app fall back to code defaults (wrong catalog, Preview mode). So all env lives
# in resources/app.yml (DABs) or is generated by scripts/deploy-v2.sh.
#
# If you ever deploy this folder DIRECTLY (not via DABs/script), set the env on
# the app instead (Apps UI → Edit → Environment): LAKEBASE_ENDPOINT,
# WAREHOUSE_ID, GOLD_CATALOG, GOLD_SCHEMA, LAKEBASE_DATABASE_NAME=databricks_postgres.
command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"
